name: Deploy dashboard to GitHub Pages

# Publishes whatever is in docs/ so the site is reachable at all times.
#
# This workflow does NOT fetch data and is NOT scheduled. The dashboard is
# rebuilt only when you ask for it (`/ipo` in Claude Code, which runs the
# analysis and pushes the result). This job simply serves the last thing that
# was published, so the address always works for anyone who visits the repo.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:        # lets you redeploy by hand if ever needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish anything personal
        # The repository is public. Holdings must never reach the site, so
        # this is checked again here rather than trusted to .gitignore alone.
        run: |
          if git ls-files --error-unmatch config/portfolio.csv >/dev/null 2>&1; then
            echo "::error::config/portfolio.csv is tracked - refusing to deploy"; exit 1
          fi
          if ls docs 2>/dev/null | grep -Ei "portfolio|holdings|secret"; then
            echo "::error::personal file found in docs/ - refusing to deploy"; exit 1
          fi
          test -s docs/index.html || { echo "::error::docs/index.html is missing or empty"; exit 1; }
          echo "Safe to deploy."

      - uses: actions/configure-pages@v5
        with:
          enablement: true    # turns Pages on if it is not already

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
